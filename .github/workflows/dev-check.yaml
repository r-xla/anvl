on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
  push:
    branches: [main, master]
  pull_request:

name: dev-check

permissions: read-all

jobs:
  dev-check:
    runs-on: ubuntu-latest
    name: dev-check

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ANVL_TEST: "1"
      PJRT_INSTALL: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://r-xla.r-universe.dev https://t-kalinowski.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install dev versions
        # Packages that DESCRIPTION's Remotes pins to a ref (`r-xla/pjrt@branch`)
        # keep the version setup-r-dependencies installed from that ref.
        run: |
          remotes <- trimws(strsplit(read.dcf("DESCRIPTION", fields = "Remotes")[1L, 1L], ",")[[1L]])
          pinned <- sub("@.*", "", grep("@", remotes, value = TRUE))
          dev <- setdiff(c("r-xla/xlamisc", "r-xla/pjrt", "r-xla/stablehlo"), pinned)
          if (length(dev)) pak::pkg_install(dev)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
