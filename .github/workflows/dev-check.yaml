on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

name: dev-check

permissions: read-all

jobs:
  dev-check:
    runs-on: ubuntu-latest
    name: dev-check

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      PJRT_PLATFORM: cpu
      # Opt in to the test suite (skipped by default, e.g. on CRAN).
      ANVL_TEST: "1"
      # Allow pjrt to download the CPU plugin non-interactively when building
      # vignettes during `R CMD check` (the dev pjrt no longer auto-downloads
      # in non-interactive sessions). The other check jobs provision the plugin
      # via custom actions; this job uses the stock r-lib action.
      PJRT_INSTALL: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://r-xla.r-universe.dev https://t-kalinowski.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install dev versions
        run: pak::pkg_install(c("r-xla/xlamisc", "r-xla/pjrt", "r-xla/stablehlo", "r-xla/tengen"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
