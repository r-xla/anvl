on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

name: integration-tests

permissions: read-all

jobs:
  integration-tests:
    # Only here: these compile a custom-call handler against {pjrt}'s FFI
    # headers, which is what we want covered once, not on every platform.
    runs-on: ubuntu-latest
    name: integrations - ubuntu x86 (cpu)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      PJRT_PLATFORM: cpu
      PJRT_INSTALL: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://r-xla.r-universe.dev https://t-kalinowski.r-universe.dev

      # Rcpp and testthat come from the package's Suggests.
      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Install anvl
        run: R CMD INSTALL .

      - name: Run integration tests
        run: Rscript integrations/run.R
