on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions:
  id-token: write

jobs:
  test-coverage:
    uses: r-xla/actions/.github/workflows/test-coverage.yaml@main
    with:
      extra-repositories: 'https://r-xla.r-universe.dev https://t-kalinowski.r-universe.dev'
      env-vars: |
        ANVL_TEST=1
        PJRT_INSTALL=1
        PJRT_PLUGIN_URL_CPU=https://github.com/r-xla/pjrt-builds/releases/download/pjrt-cpu-aa1e72c/pjrt-cpu_linux-amd64.tar.gz
