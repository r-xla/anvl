on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
  push:
    branches: [main, master]
  pull_request:

name: default-dtypes

permissions: read-all

# Runs the test suite with the default data types set to something other than
# what the pjrt backend registers, so that anything hardcoding `f32` / `i32`
# where it should read `default_dtypes()` fails here. anvl reads
# ANVL_DEFAULT_DTYPES when the `anvl.default_dtypes` option is not set.
jobs:
  default-dtypes:
    runs-on: ubuntu-latest
    name: default-dtypes (${{ matrix.dtypes }})

    strategy:
      fail-fast: false
      matrix:
        dtypes: ["float=f64,int=i64"]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ANVL_TEST: "1"
      PJRT_INSTALL: "1"
      ANVL_DEFAULT_DTYPES: ${{ matrix.dtypes }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://r-xla.r-universe.dev https://t-kalinowski.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Install dev versions
        # Packages that DESCRIPTION's Remotes pins to a ref (`r-xla/pjrt@branch`)
        # keep the version setup-r-dependencies installed from that ref.
        run: |
          remotes <- trimws(strsplit(read.dcf("DESCRIPTION", fields = "Remotes")[1L, 1L], ",")[[1L]])
          pinned <- sub("@.*", "", grep("@", remotes, value = TRUE))
          dev <- setdiff(c("r-xla/xlamisc", "r-xla/pjrt", "r-xla/stablehlo"), pinned)
          if (length(dev)) pak::pkg_install(dev)
        shell: Rscript {0}

      - name: Run the test suite
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}
