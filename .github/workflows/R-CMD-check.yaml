# One-off: check Windows against the PJRT plugin from r-xla/pjrt-builds'
# windows-jax-build branch. Do not merge.
on:
  push:
    branches: [test/windows-jax-pjrt]
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# CI budget: on pull requests only the ubuntu / release / cpu configuration
# with torch is checked. Put the `full-test` label on a PR to check the whole
# matrix (macos, macos-intel, windows, oldrel-1, oldrel-2, as-cran). Pushes to
# main/master, the weekly cron and manual dispatches always run everything.
jobs:
  setup:
    # A `labeled` event only matters when it is `full-test` going on.
    if: ${{ github.event.action != 'labeled' || contains(github.event.pull_request.labels.*.name, 'full-test') }}

    runs-on: ubuntu-latest
    name: setup
    outputs:
      config: ${{ steps.select.outputs.config }}

    steps:
      - name: Select the check configurations
        id: select
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-test') }}
        run: |
          config='[
            {"os": "windows", "runner": "windows-latest", "r": "release", "device": "cpu"}
          ]'
          echo "config=$(echo "$config" | tr -d '\n' | tr -s ' ')" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: setup
    # Each configuration carries its own runner. An `include:` entry cannot
    # serve that: one matching none of the generated combinations is added as a
    # combination of its own, which on a trimmed matrix starts jobs whose
    # config has no `r`.
    runs-on: ${{ matrix.config.runner }}

    name: ${{ matrix.config.os }} - ${{ matrix.config.device }} (${{ matrix.config.r }})${{ matrix.config.torch && ' – with torch' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.setup.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ANVL_DEFAULT_DEVICE: ${{ matrix.config.device }}
      ANVL_TEST: "1"
      PJRT_INSTALL: "1"
      PJRT_PLUGIN_URL_CPU: https://github.com/r-xla/pjrt-builds/releases/download/pjrt-windows-test/pjrt-6b73c4c-windows-x86_64.tar.gz

    steps:
      - name: Install protobuf
        if: ${{ startsWith(matrix.config.os, 'macos') }}
        run: |
          brew install protobuf@21
          brew link protobuf@21 --force --overwrite

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: https://r-xla.r-universe.dev https://t-kalinowski.r-universe.dev

      - uses: r-xla/actions/r-check@main
        with:
          install-torch: ${{ matrix.config.torch == true }}
          as-cran: ${{ matrix.config.torch == true && 'false' || 'true' }}

