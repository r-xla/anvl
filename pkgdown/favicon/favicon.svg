<svg width="600" height="693" viewBox="0 0 600 693" xmlns="http://www.w3.org/2000/svg">
<!-- White background -->
<rect width="600" height="693" fill="#ffffff"/>

<!-- Hexagon outline -->
<polygon points="300,10 540,148 540,425 300,563 60,425 60,148" fill="#ffffff" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

<!-- Anvil silhouette — three shapes: face+horn, waist, base -->
<g transform="translate(305,263) scale(1.1)" fill="#000000">
<!-- Face with horn tapering left -->
<path d="M-110,-32 L110,-32 L110,-8 L-110,-8 L-146,-14 L-146,-26 Z"/>
<!-- Waist -->
<path d="M-55,-4 L55,-4 L72,52 L-72,52 Z"/>
<!-- Base -->
<rect x="-88" y="56" width="176" height="18"/>
</g>

<!-- Package name: "anvl" -->
<text x="300" y="440" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code','DejaVu Sans Mono',monospace" font-size="52" font-weight="700" letter-spacing="6" fill="#000000">anvl</text>

</svg>
